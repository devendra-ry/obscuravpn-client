[versions]
activity-compose = "1.13.0"
android-billingclient = "9.1.0"
android-gradle-plugin = "8.13.0"
androidx-junit = "1.3.0"
#noinspection GradleDependency
androidx-lifecycle = "2.10.0" # Later versions require AGP 9.1+ and compileSdk 37
appcompat = "1.8.0"
#noinspection GradleDependency
compose-bom = "2025.12.00" # Later versions require AGP 9.1+ and compileSdk 37
#noinspection GradleDependency
core-ktx = "1.18.0" # Later versions require AGP 9.1+ and compileSdk 37
#noinspection NewerVersionAvailable
dagger = "2.58" # Later versions require AGP 9+
detekt = "1.23.8"
espresso-core = "3.7.0"
junit = "4.13.2"
#noinspection GradleDependency,NewerVersionAvailable
kotlin = "2.3.10" # Hilt in dagger 2.58 cannot read Kotlin 2.4 metadata; newer dagger needs AGP 9+
kotlinx-coroutines-play-services = "1.11.0"
#noinspection NewerVersionAvailable
kotlinx-serialization-json = "1.10.0" # 1.11+ pulls kotlin-stdlib 2.4, which Hilt in dagger 2.58 cannot read
ksp = "2.3.6"
ktfmt = "0.28.0"
material = "1.14.0"
#noinspection GradleDependency
material3 = "1.4.0" # Later versions require AGP 9.1+ and compileSdk 37
play-services-base = "18.11.1"
play-services-location = "21.4.0"

[libraries]
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
android-billingclient = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "android-billingclient" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-junit" }
androidx-lifecycle = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "dagger" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "dagger" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-playServices = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines-play-services" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
playServices-base = { group = "com.google.android.gms", name = "play-services-base", version.ref = "play-services-base" }
playServices-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "play-services-location" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "dagger" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
